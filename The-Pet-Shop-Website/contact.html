
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact The Pet Shop for general questions, pet care information, and assistance from our friendly team.">
    <title>The Pet Shop - Contact Us</title>
</head>
<body>

    <header>
        <h1>Contact The Pet Shop</h1>
        <p>We are happy to hear from you!</p>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="contact.html">Contact Us</a>
    </nav>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>
                If you have questions about pets or pet care, you can
                use the contact form below.
            </p>

            <form action="#" method="get">
                <p>
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Your Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="message">Your Message:</label><br>
                    <textarea id="message" name="message"
                              rows="5" cols="40" required></textarea>
                </p>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 The Pet Shop. All rights reserved.</p>
        <p><a href="index.html">Return to Home</a></p>
    </footer>

</body>
</html>
