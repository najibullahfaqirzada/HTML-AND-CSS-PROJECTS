
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Effects Challenge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <h1>Explore the World</h1>
        <p>Beautiful places. Beautiful design.</p>
    </header>

    <main class="gallery">
        <h2>Discover Amazing Places</h2>

        <div class="cards">
            <article class="card">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Beautiful mountain landscape">
                <h3>Mountain Escape</h3>
                <p>Find peace among the mountains.</p>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=900&q=80" alt="Tropical beach with blue water">
                <h3>Ocean Paradise</h3>
                <p>Enjoy the beauty of the sea.</p>
            </article>

            <article class="card">
                <img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=900&q=80" alt="Colorful coastal Italian village">
                <h3>Coastal Charm</h3>
                <p>Discover colorful seaside towns.</p>
            </article>
        </div>
    </main>

    <footer>
        <p>Created for the CSS Effects Challenge</p>
    </footer>
</body>
</html>
